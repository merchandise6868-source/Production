<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Central Graphic: Warehouse Box & Production Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Box Base Isometric -->
    <!-- Top Face -->
    <polygon points="0,-90 120,-25 0,40 -120,-25" fill="#f8fafc" />
    <!-- Left Face -->
    <polygon points="-120,-25 0,40 0,165 -120,100" fill="#cbd5e1" />
    <!-- Right Face -->
    <polygon points="0,40 120,-25 120,100 0,165" fill="#94a3b8" />

    <!-- Box Tape / Seam Line -->
    <polygon points="0,-90 24,-77 0,-64 -24,-77" fill="#38bdf8" />
    <line x1="0" y1="-64" x2="0" y2="40" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="40" x2="0" y2="165" stroke="#0369a1" stroke-width="8" stroke-linecap="round" />

    <!-- Checkmark Badge on Top Right of Box -->
    <circle cx="95" cy="-45" r="32" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M 83 -45 L 91 -37 L 107 -53" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Branding Text "D&D" at Bottom -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4">
    D&amp;D LONG AN
  </text>
</svg>
